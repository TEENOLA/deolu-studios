<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Adenola Testimony — deolustudio</title>
    <meta
      name="description"
      content="Frontend Developer & Founder, deolustudio"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #08080d;
        --bg-2: #0d0d16;
        --card: #101018;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --text: #f2f2f7;
        --text-dim: #9a9aab;
        --text-dimmer: #63636f;
        --blue: #4f6df5;
        --purple: #9b5cf6;
        --grad: linear-gradient(135deg, var(--blue), var(--purple));
      }

      * {
        box-sizing: border-box;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Sora", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        min-height: 100svh;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        position: relative;
        overflow-x: hidden;
      }

      /* ambient signature glow, echoes the logo's swoosh */
      .ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .ambient::before,
      .ambient::after {
        content: "";
        position: absolute;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.16;
      }
      .ambient::before {
        background: var(--blue);
        top: -20vmax;
        left: -20vmax;
      }
      .ambient::after {
        background: var(--purple);
        bottom: -22vmax;
        right: -18vmax;
      }

      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 40px 28px 28px;
        box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7);
        opacity: 0;
        transform: translateY(14px);
        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 22px;
      }
      .logo-wrap img {
        width: 84px;
        height: 84px;
        display: block;
      }

      .identity {
        text-align: center;
        margin-bottom: 28px;
      }
      .identity h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }
      .identity .title {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text-dim);
        margin: 0 0 4px;
        line-height: 1.5;
      }
      .identity .description {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text);
        margin: 4px 0 4px;
        line-height: 1.5;
      }
      .identity .title .accent {
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-weight: 600;
      }

      .rule {
        height: 1px;
        background: var(--line);
        margin: 0 0 22px;
      }

      .contact-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 24px;
      }
      .contact-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 4px;
        text-decoration: none;
        color: var(--text);
        border-radius: 12px;
        transition: background 0.2s ease;
      }
      .contact-row:hover,
      .contact-row:focus-visible {
        background: rgba(255, 255, 255, 0.03);
      }
      .contact-row:focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 2px;
      }
      .icon {
        width: 34px;
        height: 34px;
        min-width: 34px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 16px;
        height: 16px;
        stroke: var(--text);
      }
      .contact-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .contact-text .label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dimmer);
        margin-bottom: 2px;
      }
      .contact-text .value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13.5px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        font-family: "Sora", sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn svg {
        width: 17px;
        height: 17px;
      }

      .btn-primary {
        background: var(--grad);
        color: #fff;
      }
      .btn-primary:hover {
        filter: brightness(1.08);
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid var(--line-strong);
        color: var(--text);
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .footer-note {
        text-align: center;
        margin-top: 22px;
        font-size: 11px;
        color: var(--text-dimmer);
        letter-spacing: 0.02em;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%) translateY(20px);
        background: #1a1a24;
        border: 1px solid var(--line-strong);
        color: var(--text);
        padding: 12px 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        z-index: 10;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
